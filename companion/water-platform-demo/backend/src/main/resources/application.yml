spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qingyuan}
    username: ${DB_USER:qingyuan_app}
    # DB_PASSWORD 可由 compose 直接传入，也可经 DB_PASSWORD_FILE 指向
    # Docker secret 文件（由 FileSecretsEnvironmentPostProcessor 解析）
    password: ${DB_PASSWORD:teaching-only}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
security:
  jwt:
    # 教学默认值；生产以 JWT_SECRET 或 JWT_SECRET_FILE 覆盖并轮换
    secret: ${JWT_SECRET:cWluZ3l1YW4tdGVhY2hpbmctc2VjcmV0LTAxMjM0NTY3ODlhYmNkZWY=}
    access-seconds: 1800
app:
  kafka:
    reading-topic: qingyuan.reading.v1
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
