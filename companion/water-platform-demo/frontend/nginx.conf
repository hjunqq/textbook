server { listen 80; root /usr/share/nginx/html; location / { try_files $uri $uri/ /index.html; } location /api/ { proxy_pass http://backend:8080; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; } location /healthz { proxy_pass http://backend:8080/actuator/health/liveness; } location /readyz { proxy_pass http://backend:8080/actuator/health/readiness; } }
