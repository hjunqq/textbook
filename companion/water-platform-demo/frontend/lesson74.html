<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>7.3-7.4 曲线与三维联动（S5 阶段页）</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    /* 三维画布由 first-scene.js 追加到 body，曲线浮在它上面 */
    #panel {
      position: fixed; right: 12px; top: 12px; width: min(46vw, 560px);
      background: #ffffffee; border: 1px solid #c8ccd4; border-radius: 4px; padding: .6rem;
    }
    #chart { width: 100%; height: 220px; }
    #status { margin: .4rem 0 0; font-size: 13px; color: #444; }
    #tip {
      position: fixed; left: 12px; top: 12px; background: #ffffffdd;
      padding: .4rem .6rem; font-size: 13px; max-width: 34vw;
    }
  </style>
</head>
<body>
<div id="tip">
  S5 阶段页：点三维场景里的蓝色小球，右侧曲线切到该测点；点曲线上的数据点，
  对应的球变橙。点坝体或空白处会提示“未选中测点”。
  先启动 <code>node teaching-api/server.mjs</code>。
</div>
<div id="panel">
  <div id="chart"></div>
  <p id="status" role="status" aria-live="polite"></p>
</div>
<script type="module" src="/src/lesson74/main.js"></script>
</body>
</html>
