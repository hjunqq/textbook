<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预警与工单闭环｜实际接口响应</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#22343e;font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif;padding:30px 36px}h1{font-size:27px;letter-spacing:1px;margin:0 0 9px;font-weight:700;color:#154958}.kicker{font-size:12px;color:#17798a;font-weight:700;letter-spacing:2px;margin-bottom:10px}.lead{font-size:14px;line-height:1.7;color:#586970;margin:0 0 23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{border:1px solid #cbdadd;border-top:3px solid #247587;padding:17px 20px;background:#f9fcfc;min-height:146px}.card h2{font-size:20px;margin:0 0 10px}.card code,td code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px}.hint{font-size:12px;line-height:1.6;color:#61747c;margin-top:14px}.result{font-size:20px;line-height:1.8;margin-top:17px;font-weight:600}.result[data-state=error]{color:#aa3c32}.result[data-state=empty],.result[data-state=loading]{color:#647782}.foot{font-size:11px;color:#647782;margin-top:20px;border-top:1px solid #d9e4e7;padding-top:10px}.badge{display:inline-block;font-size:12px;color:#fff;background:#247587;border-radius:3px;padding:3px 8px;margin-right:9px}.badge.bad{background:#b65e3c}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:#31596b;font-weight:600;background:#eef5f6}td,th{padding:10px 12px;border-bottom:1px solid #d5e0e3}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4f6;padding:14px 16px;margin:14px 0 0;font:14px/1.6 Consolas,"Microsoft YaHei",monospace;color:#274653}.tag{font-size:12px;color:#527988}.detail{font-size:13px;color:#516570;line-height:1.75}.status{font-size:14px;line-height:1.65;color:#264b5b}.caption{font-size:13px;color:#4b626c;line-height:1.7}body{padding:18px 26px}h1{font-size:27px}.lead{font-size:20px;margin-bottom:14px}.card{padding:13px 15px;min-height:138px}.card h2{font-size:21px}.card code,td code{font-size:20px}.hint{font-size:20px;line-height:1.5}.result{font-size:22px;line-height:1.55}.badge{font-size:20px}.foot{font-size:12px;margin-top:12px}pre{font-size:20px;line-height:1.55;padding:12px}.detail{font-size:20px;line-height:1.5}td,th{font-size:20px;padding:8px 10px}.status{font-size:20px}</style><body>
<div id="steps" class="grid" style="grid-template-columns:repeat(4,1fr);gap:11px"></div><div id="rejection" class="detail" style="margin-top:15px;color:#995324"></div><div class="foot">教学查看器</div><script type="module">
const token=(await (await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'duty01',password:'duty123'})})).json()).accessToken;const auth={Authorization:'Bearer '+token};const headers={...auth,'Content-Type':'application/json'};window.workflowRecords=[];async function call(url,method='GET',body){const r=await fetch(url,{method,headers,...(body?{body:JSON.stringify(body)}:{})}),raw=await r.text(),json=raw?JSON.parse(raw):null;const record={method,url,requestBody:body??null,status:r.status,location:r.headers.get('location'),rawBody:raw,body:json};window.workflowRecords.push(record);return record;}const list=await call('/api/warnings'),open=list.body.find(w=>w.status==='open'&&w.evaluable);if(!open)throw new Error('No open evaluable warning');const createBody={warningId:open.warningId,ownerRole:'运维员',dueAt:'2026-07-06T12:00:00+08:00',action:'教学演练：现场核查预警对应的监测点'};const early=await call('/api/work-orders','POST',createBody),ack=await call('/api/warnings/'+open.warningId+'/ack','POST'),created=await call('/api/work-orders','POST',createBody),completed=await call('/api/work-orders/'+created.body.workOrderId+'/complete','POST',{result:'教学演练：完成现场核查并登记处理结果'}),after=await call('/api/warnings?assetId='+open.assetId);const closed=after.body.find(w=>w.warningId===open.warningId);const steps=[['01 确认预警',ack,'预警',ack.body.warningId,ack.body.status],['02 创建工单',created,'工单',created.body.workOrderId,created.body.status],['03 完成工单',completed,'工单',completed.body.workOrderId,completed.body.status],['04 回查归档',after,'预警',closed.warningId,closed.status]];for(const[title,record,type,id,status]of steps){const section=document.createElement('section');section.className='card';section.style.minHeight='183px';const h=document.createElement('h2');h.textContent=title;const badge=document.createElement('div');badge.className='tag';badge.style.fontSize='20px';badge.textContent='HTTP '+record.status;const key=document.createElement('div');key.className='detail';key.style.marginTop='17px';key.textContent=type+' '+id;const state=document.createElement('pre');state.style.fontSize='20px';state.style.padding='10px 5px';state.style.marginTop='10px';state.textContent=status;section.append(h,badge,key,state);document.querySelector('#steps').append(section);}document.querySelector('#rejection').textContent='实际失败例：未确认就派单 → HTTP '+early.status+' · '+early.body.code;window.workflowEvidence={warningId:open.warningId,assetId:open.assetId,workOrderId:created.body.workOrderId,statuses:[early.status,ack.status,created.status,completed.status,after.status],states:[ack.body.status,created.body.status,completed.body.status,closed.status],memoryOnly:true};window.captureReady=true;</script></body></html>
