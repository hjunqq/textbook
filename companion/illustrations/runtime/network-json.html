const token=(await (await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'duty01',password:'duty123'})})).json()).accessToken;const auth={Authorization:'Bearer '+token};const cases=[['PZ-07 / readings/latest','/api/assets/DAM-A-PZ-07/readings/latest'],['D-01 / readings/latest','/api/assets/DAM-A-D-01/readings/latest'],['PZ-07 / readings?from=…&to=…','/api/assets/DAM-A-PZ-07/readings?from=2026-07-02T00%3A00%3A00%2B08%3A00&to=2026-07-01T00%3A00%3A00%2B08%3A00'],['XX-99 / readings/latest','/api/assets/DAM-A-XX-99/readings/latest']];window.networkRecords=[];for(const[label,url]of cases){const r=await fetch(url,{headers:auth}),raw=await r.text(),body=raw?JSON.parse(raw):null;window.networkRecords.push({method:'GET',url,status:r.status,rawBody:raw,body});const tr=document.createElement('tr');if(r.status===400){tr.style.background='#fff2e5';document.querySelector('#json').textContent=JSON.stringify(body,null,2);}for(const text of[label,String(r.status)]){const td=document.createElement('td');td.textContent=text;td.style.fontSize='20px';td.style.padding='16px 9px';tr.append(td);}document.querySelector('#network').append(tr);}window.captureReady=true;</script></body></html>
