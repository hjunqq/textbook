<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快速切换｜请求取消的运行记录</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#22343e;font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif;padding:30px 36px}h1{font-size:27px;letter-spacing:1px;margin:0 0 9px;font-weight:700;color:#154958}.kicker{font-size:12px;color:#17798a;font-weight:700;letter-spacing:2px;margin-bottom:10px}.lead{font-size:14px;line-height:1.7;color:#586970;margin:0 0 23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{border:1px solid #cbdadd;border-top:3px solid #247587;padding:17px 20px;background:#f9fcfc;min-height:146px}.card h2{font-size:20px;margin:0 0 10px}.card code,td code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px}.hint{font-size:12px;line-height:1.6;color:#61747c;margin-top:14px}.result{font-size:20px;line-height:1.8;margin-top:17px;font-weight:600}.result[data-state=error]{color:#aa3c32}.result[data-state=empty],.result[data-state=loading]{color:#647782}.foot{font-size:11px;color:#647782;margin-top:20px;border-top:1px solid #d9e4e7;padding-top:10px}.badge{display:inline-block;font-size:12px;color:#fff;background:#247587;border-radius:3px;padding:3px 8px;margin-right:9px}.badge.bad{background:#b65e3c}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:#31596b;font-weight:600;background:#eef5f6}td,th{padding:10px 12px;border-bottom:1px solid #d5e0e3}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4f6;padding:14px 16px;margin:14px 0 0;font:14px/1.6 Consolas,"Microsoft YaHei",monospace;color:#274653}.tag{font-size:12px;color:#527988}.detail{font-size:13px;color:#516570;line-height:1.75}.status{font-size:14px;line-height:1.65;color:#264b5b}.caption{font-size:13px;color:#4b626c;line-height:1.7}body{padding:18px 26px}h1{font-size:27px}.lead{font-size:20px;margin-bottom:14px}.card{padding:13px 15px;min-height:138px}.card h2{font-size:21px}.card code,td code{font-size:20px}.hint{font-size:20px;line-height:1.5}.result{font-size:22px;line-height:1.55}.badge{font-size:20px}.foot{font-size:12px;margin-top:12px}pre{font-size:20px;line-height:1.55;padding:12px}.detail{font-size:20px;line-height:1.5}td,th{font-size:20px;padding:8px 10px}.status{font-size:20px}.switch-grid{display:grid;grid-template-columns:30% 1fr;gap:18px}.switch-grid .card{min-height:225px}.switch-grid td,.switch-grid th{padding:10px 8px;font-size:20px}.switch-grid td:first-child{width:56px}.switch-grid th:first-child{white-space:nowrap}.switch-grid .result{font-size:22px}.switch-grid h2{font-size:21px}.lead{max-width:100%;margin-bottom:17px}</style><body>
<div class="switch-grid"><div class="card"><h2>当前选择：<br>案例库水位01</h2><code>DAM-A-WL-01</code><p id="latest" class="result"></p></div><table><thead><tr><th>序号</th><th>实际操作</th><th>请求结果</th></tr></thead><tbody id="timeline"></tbody></table></div><div class="foot">教学查看器</div><script type="module">
const nativeFetch=window.fetch.bind(window),events=[];window.fetch=async(input,init)=>{const url=String(input);if(!url.includes('/readings/latest'))return nativeFetch(input,init);const assetId=url.split('/')[3];events.push({action:'开始读取 '+assetId,result:'等待响应'});try{const response=await nativeFetch(input,init);events.push({action:assetId,result:'HTTP '+response.status});return response;}catch(error){events.push({action:assetId,result:error.name==='AbortError'?'AbortError：旧请求被取消':error.name});throw error;}};
const{login,loadAssets}=await import('/src/lesson45/detail.js');const{showAsset}=await import('/src/lesson45/controller.js');await login('duty01','duty123');const assets=await loadAssets(),el=document.querySelector('#latest');const first=showAsset(el,assets.find(a=>a.assetId==='DAM-A-PZ-07'));await new Promise(r=>setTimeout(r,150));const second=showAsset(el,assets.find(a=>a.assetId==='DAM-A-WL-01'));await Promise.all([first,second]);await new Promise(r=>setTimeout(r,3200));events.forEach((event,i)=>{const tr=document.createElement('tr');for(const text of[String(i+1).padStart(2,'0'),event.action,event.result]){const td=document.createElement('td');td.textContent=text;tr.append(td);}document.querySelector('#timeline').append(tr);});window.events=events;window.captureReady=true;</script></body></html>
