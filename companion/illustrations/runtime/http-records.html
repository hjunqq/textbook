<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTTP响应实录｜教学接口</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#22343e;font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif;padding:30px 36px}h1{font-size:27px;letter-spacing:1px;margin:0 0 9px;font-weight:700;color:#154958}.kicker{font-size:12px;color:#17798a;font-weight:700;letter-spacing:2px;margin-bottom:10px}.lead{font-size:14px;line-height:1.7;color:#586970;margin:0 0 23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{border:1px solid #cbdadd;border-top:3px solid #247587;padding:17px 20px;background:#f9fcfc;min-height:146px}.card h2{font-size:20px;margin:0 0 10px}.card code,td code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px}.hint{font-size:12px;line-height:1.6;color:#61747c;margin-top:14px}.result{font-size:20px;line-height:1.8;margin-top:17px;font-weight:600}.result[data-state=error]{color:#aa3c32}.result[data-state=empty],.result[data-state=loading]{color:#647782}.foot{font-size:11px;color:#647782;margin-top:20px;border-top:1px solid #d9e4e7;padding-top:10px}.badge{display:inline-block;font-size:12px;color:#fff;background:#247587;border-radius:3px;padding:3px 8px;margin-right:9px}.badge.bad{background:#b65e3c}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:#31596b;font-weight:600;background:#eef5f6}td,th{padding:10px 12px;border-bottom:1px solid #d5e0e3}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4f6;padding:14px 16px;margin:14px 0 0;font:14px/1.6 Consolas,"Microsoft YaHei",monospace;color:#274653}.tag{font-size:12px;color:#527988}.detail{font-size:13px;color:#516570;line-height:1.75}.status{font-size:14px;line-height:1.65;color:#264b5b}.caption{font-size:13px;color:#4b626c;line-height:1.7}body{padding:18px 26px}h1{font-size:27px}.lead{font-size:20px;margin-bottom:14px}.card{padding:13px 15px;min-height:138px}.card h2{font-size:21px}.card code,td code{font-size:20px}.hint{font-size:20px;line-height:1.5}.result{font-size:22px;line-height:1.55}.badge{font-size:20px}.foot{font-size:12px;margin-top:12px}pre{font-size:20px;line-height:1.55;padding:12px}.detail{font-size:20px;line-height:1.5}td,th{font-size:20px;padding:8px 10px}.status{font-size:20px}</style><body>
<div id="records" class="grid"></div><div class="foot">教学查看器</div><script type="module">
const token=(await (await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'duty01',password:'duty123'})})).json()).accessToken;const auth={Authorization:'Bearer '+token};
const cases=[['最新观测','/api/assets/DAM-A-PZ-07/readings/latest'],['尚无观测','/api/assets/DAM-A-D-01/readings/latest'],['时间范围错误','/api/assets/DAM-A-PZ-07/readings?from=2026-07-02T00%3A00%3A00%2B08%3A00&to=2026-07-01T00%3A00%3A00%2B08%3A00'],['未知对象','/api/assets/DAM-A-XX-99/readings/latest']];window.records=[];
for(const [title,url]of cases){const r=await fetch(url,{headers:auth});const body=await r.text();const record={title,url,status:r.status,contentType:r.headers.get('content-type'),rawBody:body,body:body?JSON.parse(body):null};window.records.push(record);if(r.status<400)continue;const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent=title+' · HTTP '+r.status;section.append(h);const route=document.createElement('div');route.className='detail';route.textContent=r.status===400?'请求条件：起始时间晚于结束时间':'对象编码：DAM-A-XX-99';section.append(route);const pre=document.createElement('pre');if(body){const obj=JSON.parse(body);pre.textContent=JSON.stringify(obj,null,2);}else pre.textContent='（响应体为空）';section.append(pre);document.getElementById('records').append(section);}window.captureReady=true;</script></body></html>
