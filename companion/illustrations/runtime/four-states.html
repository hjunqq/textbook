<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页面四态｜实际接口与状态模块</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#22343e;font-family:"Microsoft YaHei", "Noto Sans CJK SC", sans-serif;padding:30px 36px}h1{font-size:27px;letter-spacing:1px;margin:0 0 9px;font-weight:700;color:#154958}.kicker{font-size:12px;color:#17798a;font-weight:700;letter-spacing:2px;margin-bottom:10px}.lead{font-size:14px;line-height:1.7;color:#586970;margin:0 0 23px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.card{border:1px solid #cbdadd;border-top:3px solid #247587;padding:17px 20px;background:#f9fcfc;min-height:146px}.card h2{font-size:20px;margin:0 0 10px}.card code,td code{font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px}.hint{font-size:12px;line-height:1.6;color:#61747c;margin-top:14px}.result{font-size:20px;line-height:1.8;margin-top:17px;font-weight:600}.result[data-state=error]{color:#aa3c32}.result[data-state=empty],.result[data-state=loading]{color:#647782}.foot{font-size:11px;color:#647782;margin-top:20px;border-top:1px solid #d9e4e7;padding-top:10px}.badge{display:inline-block;font-size:12px;color:#fff;background:#247587;border-radius:3px;padding:3px 8px;margin-right:9px}.badge.bad{background:#b65e3c}table{border-collapse:collapse;width:100%;font-size:14px}th{text-align:left;color:#31596b;font-weight:600;background:#eef5f6}td,th{padding:10px 12px;border-bottom:1px solid #d5e0e3}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef4f6;padding:14px 16px;margin:14px 0 0;font:14px/1.6 Consolas,"Microsoft YaHei",monospace;color:#274653}.tag{font-size:12px;color:#527988}.detail{font-size:13px;color:#516570;line-height:1.75}.status{font-size:14px;line-height:1.65;color:#264b5b}.caption{font-size:13px;color:#4b626c;line-height:1.7}body{padding:18px 26px}h1{font-size:27px}.lead{font-size:20px;margin-bottom:14px}.card{padding:13px 15px;min-height:138px}.card h2{font-size:21px}.card code,td code{font-size:20px}.hint{font-size:20px;line-height:1.5}.result{font-size:22px;line-height:1.55}.badge{font-size:20px}.foot{font-size:12px;margin-top:12px}pre{font-size:20px;line-height:1.55;padding:12px}.detail{font-size:20px;line-height:1.5}td,th{font-size:20px;padding:8px 10px}.status{font-size:20px}.grid{grid-template-columns:repeat(4,1fr);gap:11px}.hint{display:none}.card code{font-size:20px}.card{min-height:190px}.badge{display:block;width:max-content;margin-bottom:8px}.result{font-size:21px}.result[data-state=error]{font-size:20px}</style><body>

<div class="grid">
 <section class="card"><h2><span class="badge">loading</span>请求等待</h2><code>DAM-A-PZ-06<br>teach=delay:15000</code><p id="loading" class="result"></p><div class="hint">请求仍在等待；先显示正在读取，保留交互反馈。</div></section>
 <section class="card"><h2><span class="badge">ready</span>已有观测</h2><code>DAM-A-PZ-07<br>HTTP 200</code><p id="ready" class="result"></p><div class="hint">读取数值、单位与质量码，并交给同一状态渲染函数。</div></section>
 <section class="card"><h2><span class="badge">empty</span>尚无观测</h2><code>DAM-A-D-01<br>HTTP 204</code><p id="empty" class="result"></p><div class="hint">204不带观测对象；空结果不会被写成数值0。</div></section>
 <section class="card"><h2><span class="badge bad">error</span>对象不存在</h2><code>DAM-A-XX-99<br>HTTP 404</code><p id="error" class="result"></p><div class="hint">统一错误体转为页面提示，保留返回列表的恢复路径。</div></section>
</div><div class="foot">教学查看器</div><script type="module">
import {login,loadAssets,loadLatest} from '/src/lesson45/detail.js';import{State,render}from'/src/lesson45/state.js';
await login('duty01','duty123');const assets=await loadAssets();const at=id=>assets.find(a=>a.assetId===id)||{assetId:id,displayName:id};
async function inspect(target,id){const el=document.getElementById(target),asset=at(id);render(el,{state:State.LOADING,asset});try{const reading=await loadLatest(id);render(el,reading?{state:State.READY,asset,reading}:{state:State.EMPTY,asset});}catch(error){render(el,{state:State.ERROR,asset,error});}}
inspect('loading','DAM-A-PZ-06');await Promise.all([inspect('ready','DAM-A-PZ-07'),inspect('empty','DAM-A-D-01'),inspect('error','DAM-A-XX-99')]);window.captureReady=true;</script></body></html>
