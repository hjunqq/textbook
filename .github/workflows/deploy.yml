name: 🚀 部署智慧水利教材到 GitHub Pages

on:
  # 当推送到 main 或 master 分支时触发
  push:
    branches: [ main, master ]
  
  # 允许手动触发工作流
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建作业
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📚 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # 获取完整历史记录以支持 git 信息

    - name: � 配置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 安装 uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: 💾 设置 Python 缓存
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: 📥 安装项目依赖
      run: |
        echo "🔍 检查项目依赖..."
        if [ -f "uv.lock" ]; then
          echo "📄 发现 uv.lock，使用锁定文件安装依赖..."
          uv sync
        else
          echo "📦 未发现锁定文件，执行完整安装..."
          uv sync --dev
        fi
        echo "✅ 项目依赖安装完成！"

    - name: 🔨 构建 MkDocs 静态站点
      run: |
        echo "📖 开始构建智慧水利平台架构与开发教材..."
        # 确保 index.md 存在于 docs 目录
        if [ ! -f "docs/index.md" ] && [ -f "index.md" ]; then
          echo "📄 复制 index.md 到 docs 目录..."
          cp index.md docs/
        fi
        uv run mkdocs build
        echo "✅ 构建完成！"

    - name: 🗂️ 配置构建产物
      run: |
        # 创建 .nojekyll 文件以禁用 Jekyll 处理
        touch site/.nojekyll
        
        # 添加自定义域名文件（如果需要的话）
        # echo "your-domain.com" > site/CNAME
        
        # 显示构建产物信息
        echo "📁 构建产物目录结构："
        ls -la site/
        
        echo "📊 构建产物大小："
        du -sh site/

    - name: 📤 上传构建产物
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./site

  # 部署作业
  deploy:
    needs: build
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: 🌐 部署到 GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: 🎉 部署成功通知
      run: |
        echo "🎊 智慧水利平台架构与开发教材已成功部署！"
        echo "🔗 访问地址: ${{ steps.deployment.outputs.page_url }}"
        echo "📚 教材使用 MkDocs + Material 主题构建"
        echo "📖 教材包含以下章节："
        echo "   第一章: 总论"
        echo "   第二章: 软件工程基础与需求分析"
        echo "   第三章: 现代软件开发方法与工具"
        echo "   第四章: 前端开发基础"
        echo "   第五章: 后端开发基础"
        echo "   第六章: 智慧水利三维场景构建"
        echo "   第七章: 监测数据与三维场景融合"
        echo "   第八章: 智慧水利平台典型应用" 