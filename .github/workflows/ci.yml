name: 🔍 质量门禁

on:
  push:
    branches: [ main, master, 'revision/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  compose-config:
    name: docker compose 配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备 secrets 占位文件
        working-directory: companion/water-platform-demo
        run: for f in secrets/*.example; do cp "$f" "${f%.example}"; done
      - name: compose config 必须可解析
        working-directory: companion/water-platform-demo
        run: docker compose config -q
      - name: Kafka 环境变量不得被逗号拆键
        working-directory: companion/water-platform-demo
        # 变量名随 R8-c 从 bitnami 换到官方 apache/kafka 镜像后去掉了 CFG_ 段
        run: |
          docker compose config | grep -q 'KAFKA_PROCESS_ROLES: broker,controller' || \
          docker compose config | grep -q 'KAFKA_PROCESS_ROLES: "broker,controller"'

      - name: 初始化脚本只能挂 001 与 002
        working-directory: companion/water-platform-demo
        # 整个 ./db 挂进 /docker-entrypoint-initdb.d 会连 load-s3-data.sql 一起执行，
        # 它读的 ../datasets/*.csv 在容器里不存在，Postgres 初始化失败、整栈起不来。
        run: |
          ! docker compose config | grep -qE '\./db:/docker-entrypoint-initdb\.d'

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: companion/water-platform-demo/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: companion/water-platform-demo/frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: companion/water-platform-demo/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - run: mvn -B -q test

  docs-strict:
    name: 在线版严格构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install mkdocs-material
      - run: mkdocs build --strict -f mkdocs-ci.yml

  listings:
    name: 书中清单与配套代码一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      # 清单一旦与 companion 漂移，读者照书敲出来的代码跑不起来，
      # 而 check_textbook.py 仍然全绿——这条补的就是那个缺口。
      - run: python tools/check_listings.py

  teaching-api:
    name: 教学接口契约与第8章闭环
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: companion/water-platform-demo}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: 启动教学接口
        run: |
          node teaching-api/server.mjs 8080 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:8080/api/assets && break || sleep 1; done
      - name: 接口契约（表 tab:ch05-first-verify 与 8.1 通用约定）
        run: node teaching-api/contract-check.mjs http://localhost:8080 --stage=teaching
      - name: 预警到工单闭环（8.4 受控状态流转）
        run: node teaching-api/closeloop-check.mjs http://localhost:8080

  stage-lesson52:
    name: S3 起点可启动且契约一致
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: 启动 5.2 节的起点包
        working-directory: companion/water-platform-demo/backend
        # 起点包没有数据库也没有认证，能独立启动是 5.2 节的前提
        run: |
          mvn -B -q spring-boot:run \
            -Dspring-boot.run.main-class=edu.example.lesson52.Lesson52Application &
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8080/api/assets && break || sleep 2; done
      - name: 契约核对
        working-directory: companion/water-platform-demo
        run: node teaching-api/contract-check.mjs http://localhost:8080 --stage=lesson52

  stage-lesson54:
    name: S3 中点（接数据库、三层、无认证）可启动且契约一致
    runs-on: ubuntu-latest
    # 隔离的一次性数据库：服务容器随作业创建、随作业销毁，不使用也不清理任何已有数据卷。
    # 无认证入口只在这个隔离环境里监听 runner 本机端口。
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env: {POSTGRES_DB: qingyuan, POSTGRES_USER: qingyuan_app, POSTGRES_PASSWORD: ci-only-lesson54}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qingyuan_app -d qingyuan"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/qingyuan
      DB_USER: qingyuan_app
      DB_PASSWORD: ci-only-lesson54
      PGPASSWORD: ci-only-lesson54
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: 记录环境
        run: |
          mkdir -p ci-logs
          { java -version; mvn -version; node --version; } > ci-logs/environment.txt 2>&1
      - name: 后端单元与切片测试（mvn -q test）
        working-directory: companion/water-platform-demo/backend
        run: |
          set +e
          mvn -B -q test 2>&1 | tee ../../../ci-logs/mvn-test.log
          rc=${PIPESTATUS[0]}
          echo "mvn test exit=$rc" >> ../../../ci-logs/exit-codes.txt
          exit $rc
      - name: 建表并写入种子数据（与 compose 初始化同一组脚本）
        working-directory: companion/water-platform-demo
        run: |
          set +e
          rc=0
          for f in db/001_init.sql db/002_seed.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -U qingyuan_app -d qingyuan -f "$f" 2>&1 | tee -a ../../ci-logs/db-init.log
            r=${PIPESTATUS[0]}; [ "$r" != "0" ] && rc=$r
          done
          echo "db init exit=$rc" >> ../../ci-logs/exit-codes.txt
          exit $rc
      - name: 启动 Lesson54Application
        working-directory: companion/water-platform-demo/backend
        run: |
          nohup mvn -B -q spring-boot:run \
            -Dspring-boot.run.main-class=edu.example.lesson54.Lesson54Application \
            > ../../../ci-logs/lesson54-startup.log 2>&1 &
          echo $! > ../../../ci-logs/lesson54.pid
          ok=0
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/assets || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 2
          done
          echo "lesson54 ready=$ok last_http=$code" >> ../../../ci-logs/exit-codes.txt
          test "$ok" = "1"
      - name: 真实 Java 入口的契约核对（--stage=lesson54）
        working-directory: companion/water-platform-demo
        run: |
          set +e
          node teaching-api/contract-check.mjs http://localhost:8080 --stage=lesson54 2>&1 | tee ../../ci-logs/contract-lesson54.log
          rc=${PIPESTATUS[0]}
          echo "contract-check lesson54 exit=$rc" >> ../../ci-logs/exit-codes.txt
          exit $rc
      - name: 书中运行记录表的两项观察
        run: |
          curl -s http://localhost:8080/api/assets | tee ci-logs/assets.json
          curl -s -o /dev/null -w 'D-01 latest http=%{http_code}\n' http://localhost:8080/api/assets/DAM-A-D-01/readings/latest | tee -a ci-logs/exit-codes.txt
          curl -s -o /dev/null -w 'XX-99 latest http=%{http_code}\n' http://localhost:8080/api/assets/DAM-A-XX-99/readings/latest | tee -a ci-logs/exit-codes.txt
      - name: 保留启动日志、实际结果与退出码
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: stage-lesson54-logs, path: ci-logs/, if-no-files-found: warn}

  stack-e2e:
    name: 整栈端到端（compose + smoke）
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: companion/water-platform-demo}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: 准备 secrets 占位文件
        run: for f in secrets/*.example; do cp "$f" "${f%.example}"; done
      - name: 启动全栈
        run: docker compose up -d --build --wait
      - name: 端到端冒烟（启动—401—登录—取数—错误口令）
        run: ./smoke.sh
      - name: 真实后端的契约核对
        run: node teaching-api/contract-check.mjs http://localhost:8080 --stage=full
      - name: 失败时导出容器日志
        if: failure()
        run: docker compose logs --tail=120
      - name: 清理
        if: always()
        run: docker compose down -v
