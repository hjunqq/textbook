# Markdown扩展
markdown_extensions:
  - admonition           # 警告、提示框
  - footnotes            # 脚注
  - pymdownx.highlight    # 代码高亮
  - pymdownx.superfences  # 代码块、图表
  - pymdownx.tabbed       # 选项卡
  - attr_list             # 属性列表
  - def_list              # 定义列表
  - tables                # 表格
  - pymdownx.emoji:       # 表情符号
      emoji_generator: 'material.extensions.twemoji'

# 插件
plugins:
  - search               # 搜索功能
  - git-revision-date-localized:  # 显示最后更新日期
      enable_creation_date: true
      fallback_to_build_date: true
      enable_git_follow: false

# 版权信息
copyright: Copyright &copy; 2025

