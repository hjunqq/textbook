<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="450" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="700" height="450" fill="#f9f9f9"/>
  
  <!-- 标题 -->
  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">分布式版本控制工作流程示意图</text>
  
  <!-- 定义箭头 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#666"/>
    </marker>
  </defs>
  
  <!-- 远程服务器 -->
  <rect x="300" y="50" width="100" height="70" fill="#4CAF50" stroke="#388E3C" stroke-width="2" rx="8"/>
  <text x="350" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">远程仓库</text>
  <text x="350" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">(GitHub)</text>
  <text x="350" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">origin/main</text>
  
  <!-- 开发者A -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="120" height="100" fill="#E3F2FD" stroke="#2196F3" stroke-width="2" rx="8"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976D2">开发者A</text>
    
    <!-- 本地仓库 -->
    <rect x="10" y="30" width="45" height="30" fill="#2196F3" stroke="#1976D2" rx="4"/>
    <text x="32" y="47" text-anchor="middle" font-size="8" fill="white">本地仓库</text>
    
    <!-- 工作区 -->
    <rect x="65" y="30" width="45" height="30" fill="#BBDEFB" stroke="#2196F3" rx="4"/>
    <text x="87" y="47" text-anchor="middle" font-size="8" fill="#1976D2">工作区</text>
    
    <!-- 暂存区 -->
    <rect x="10" y="65" width="45" height="25" fill="#90CAF9" stroke="#2196F3" rx="4"/>
    <text x="32" y="79" text-anchor="middle" font-size="8" fill="#1976D2">暂存区</text>
  </g>
  
  <!-- 开发者B -->
  <g transform="translate(500, 180)">
    <rect x="0" y="0" width="120" height="100" fill="#E8F5E8" stroke="#4CAF50" stroke-width="2" rx="8"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#388E3C">开发者B</text>
    
    <!-- 本地仓库 -->
    <rect x="10" y="30" width="45" height="30" fill="#4CAF50" stroke="#388E3C" rx="4"/>
    <text x="32" y="47" text-anchor="middle" font-size="8" fill="white">本地仓库</text>
    
    <!-- 工作区 -->
    <rect x="65" y="30" width="45" height="30" fill="#C8E6C9" stroke="#4CAF50" rx="4"/>
    <text x="87" y="47" text-anchor="middle" font-size="8" fill="#388E3C">工作区</text>
    
    <!-- 暂存区 -->
    <rect x="10" y="65" width="45" height="25" fill="#A5D6A7" stroke="#4CAF50" rx="4"/>
    <text x="32" y="79" text-anchor="middle" font-size="8" fill="#388E3C">暂存区</text>
  </g>
  
  <!-- 开发者C -->
  <g transform="translate(290, 320)">
    <rect x="0" y="0" width="120" height="100" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" rx="8"/>
    <text x="60" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#F57C00">开发者C</text>
    
    <!-- 本地仓库 -->
    <rect x="10" y="30" width="45" height="30" fill="#FF9800" stroke="#F57C00" rx="4"/>
    <text x="32" y="47" text-anchor="middle" font-size="8" fill="white">本地仓库</text>
    
    <!-- 工作区 -->
    <rect x="65" y="30" width="45" height="30" fill="#FFE0B2" stroke="#FF9800" rx="4"/>
    <text x="87" y="47" text-anchor="middle" font-size="8" fill="#F57C00">工作区</text>
    
    <!-- 暂存区 -->
    <rect x="10" y="65" width="45" height="25" fill="#FFCC02" stroke="#FF9800" rx="4"/>
    <text x="32" y="79" text-anchor="middle" font-size="8" fill="#F57C00">暂存区</text>
  </g>
  
  <!-- 连接线 - clone/fetch/pull -->
  <path d="M 320 120 Q 250 150 160 180" stroke="#2196F3" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="220" y="145" font-size="9" fill="#1976D2">clone/pull</text>
  
  <path d="M 380 120 Q 450 150 540 180" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="470" y="145" font-size="9" fill="#388E3C">clone/pull</text>
  
  <path d="M 350 120 L 350 320" stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="355" y="220" font-size="9" fill="#F57C00">clone/pull</text>
  
  <!-- 连接线 - push -->
  <path d="M 160 180 Q 250 150 320 120" stroke="#F44336" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="220" y="135" font-size="9" fill="#D32F2F">push</text>
  
  <path d="M 540 180 Q 450 150 380 120" stroke="#F44336" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="470" y="135" font-size="9" fill="#D32F2F">push</text>
  
  <path d="M 350 320 L 350 120" stroke="#F44336" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="320" y="220" font-size="9" fill="#D32F2F">push</text>
  
  <!-- 开发者之间的协作 -->
  <path d="M 200 230 Q 350 300 500 230" stroke="#9C27B0" stroke-width="1" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow)"/>
  <text x="350" y="290" text-anchor="middle" font-size="9" fill="#7B1FA2">直接协作(可选)</text>
  
  <!-- Git命令示例 -->
  <g transform="translate(30, 350)">
    <text x="0" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#555">常用Git命令：</text>
    <text x="0" y="35" font-size="10" fill="#666">• git clone: 克隆远程仓库到本地</text>
    <text x="250" y="35" font-size="10" fill="#666">• git add: 添加文件到暂存区</text>
    <text x="450" y="35" font-size="10" fill="#666">• git commit: 提交到本地仓库</text>
    <text x="0" y="50" font-size="10" fill="#666">• git push: 推送到远程仓库</text>
    <text x="250" y="50" font-size="10" fill="#666">• git pull: 拉取远程仓库更新</text>
    <text x="450" y="50" font-size="10" fill="#666">• git merge: 合并分支</text>
  </g>
  
  <!-- 特点说明 -->
  <rect x="20" y="50" width="140" height="80" fill="#F3E5F5" stroke="#9C27B0" rx="5"/>
  <text x="90" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#7B1FA2">DVCS特点</text>
  <text x="90" y="85" text-anchor="middle" font-size="9" fill="#4A148C">• 每个节点都是完整仓库</text>
  <text x="90" y="98" text-anchor="middle" font-size="9" fill="#4A148C">• 支持离线工作</text>
  <text x="90" y="111" text-anchor="middle" font-size="9" fill="#4A148C">• 分布式协作</text>
  <text x="90" y="124" text-anchor="middle" font-size="9" fill="#4A148C">• 更好的分支管理</text>
</svg>