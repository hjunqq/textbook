<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 16px sans-serif; text-anchor: middle; }
      .area-title { font: bold 12px sans-serif; text-anchor: middle; }
      .command { font: bold 10px sans-serif; text-anchor: middle; fill: #d63031; }
    </style>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="30" class="title">Git工作流程</text>
  
  <!-- 三个区域 -->
  <rect x="50" y="80" width="180" height="120" rx="5" fill="#ffecb3" stroke="#333" stroke-width="2"/>
  <text x="140" y="110" class="area-title">工作目录</text>
  <text x="140" y="130" class="area-title">(Working Directory)</text>
  
  <rect x="310" y="80" width="180" height="120" rx="5" fill="#c8e6c9" stroke="#333" stroke-width="2"/>
  <text x="400" y="110" class="area-title">暂存区</text>
  <text x="400" y="130" class="area-title">(Staging Area)</text>
  
  <rect x="570" y="80" width="180" height="120" rx="5" fill="#bbdefb" stroke="#333" stroke-width="2"/>
  <text x="660" y="110" class="area-title">版本库</text>
  <text x="660" y="130" class="area-title">(Repository)</text>
  
  <!-- 箭头和命令标签 -->
  <!-- git add -->
  <path d="M 235 140 L 305 140" stroke="#d63031" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="270" y="130" class="command">git add</text>
  
  <!-- git commit -->
  <path d="M 495 140 L 565 140" stroke="#d63031" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="530" y="130" class="command">git commit</text>
  
  <!-- git checkout -->
  <path d="M 565 160 L 495 160" stroke="#d63031" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="530" y="180" class="command">git checkout</text>
  
  <!-- git reset -->
  <path d="M 305 160 L 235 160" stroke="#d63031" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="270" y="180" class="command">git reset</text>
  
  <!-- 箭头标记定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d63031"/>
    </marker>
  </defs>
</svg> 