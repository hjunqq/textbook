<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="480" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="480" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="300" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">自顶向下函数分解示意图</text>
  
  <!-- 定义箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- 第1层：主函数 -->
  <rect x="225" y="60" width="150" height="45" fill="#2196f3" stroke="#1976d2" stroke-width="2" rx="8"/>
  <text x="300" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white" font-weight="bold">主函数 F</text>
  
  <!-- 层次标签 -->
  <text x="20" y="88" font-family="Arial, sans-serif" font-size="12" fill="#666" font-weight="bold">第1层</text>
  
  <!-- 连接线从第1层到第2层 -->
  <line x1="250" y1="105" x2="120" y2="140" stroke="#666" stroke-width="1.5"/>
  <line x1="300" y1="105" x2="300" y2="140" stroke="#666" stroke-width="1.5"/>
  <line x1="350" y1="105" x2="480" y2="140" stroke="#666" stroke-width="1.5"/>
  
  <!-- 第2层：子函数 -->
  <rect x="60" y="150" width="120" height="40" fill="#4caf50" stroke="#388e3c" stroke-width="2" rx="6"/>
  <text x="120" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">子函数 F1</text>
  
  <rect x="240" y="150" width="120" height="40" fill="#4caf50" stroke="#388e3c" stroke-width="2" rx="6"/>
  <text x="300" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">子函数 F2</text>
  
  <rect x="420" y="150" width="120" height="40" fill="#4caf50" stroke="#388e3c" stroke-width="2" rx="6"/>
  <text x="480" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white" font-weight="bold">子函数 F3</text>
  
  <text x="20" y="175" font-family="Arial, sans-serif" font-size="12" fill="#666" font-weight="bold">第2层</text>
  
  <!-- 连接线从第2层到第3层 -->
  <line x1="90" y1="190" x2="70" y2="225" stroke="#666" stroke-width="1"/>
  <line x1="150" y1="190" x2="170" y2="225" stroke="#666" stroke-width="1"/>
  <line x1="300" y1="190" x2="300" y2="225" stroke="#666" stroke-width="1"/>
  <line x1="450" y1="190" x2="430" y2="225" stroke="#666" stroke-width="1"/>
  <line x1="510" y1="190" x2="530" y2="225" stroke="#666" stroke-width="1"/>
  
  <!-- 第3层：更细的子函数 -->
  <rect x="20" y="235" width="100" height="35" fill="#ff9800" stroke="#f57c00" stroke-width="1.5" rx="4"/>
  <text x="70" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">F1.1</text>
  
  <rect x="130" y="235" width="100" height="35" fill="#ff9800" stroke="#f57c00" stroke-width="1.5" rx="4"/>
  <text x="180" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">F1.2</text>
  
  <rect x="250" y="235" width="100" height="35" fill="#ff9800" stroke="#f57c00" stroke-width="1.5" rx="4"/>
  <text x="300" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">F2.1</text>
  
  <rect x="380" y="235" width="100" height="35" fill="#ff9800" stroke="#f57c00" stroke-width="1.5" rx="4"/>
  <text x="430" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">F3.1</text>
  
  <rect x="490" y="235" width="100" height="35" fill="#ff9800" stroke="#f57c00" stroke-width="1.5" rx="4"/>
  <text x="540" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">F3.2</text>
  
  <text x="20" y="257" font-family="Arial, sans-serif" font-size="12" fill="#666" font-weight="bold">第3层</text>
  
  <!-- 连接线从第3层到第4层 -->
  <line x1="180" y1="270" x2="180" y2="300" stroke="#666" stroke-width="1"/>
  <line x1="430" y1="270" x2="430" y2="300" stroke="#666" stroke-width="1"/>
  
  <!-- 第4层：最具体的函数 -->
  <rect x="130" y="310" width="100" height="30" fill="#e91e63" stroke="#c2185b" stroke-width="1.5" rx="4"/>
  <text x="180" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">F1.2.1</text>
  
  <rect x="380" y="310" width="100" height="30" fill="#e91e63" stroke="#c2185b" stroke-width="1.5" rx="4"/>
  <text x="430" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">F3.1.1</text>
  
  <text x="20" y="330" font-family="Arial, sans-serif" font-size="12" fill="#666" font-weight="bold">第4层</text>
  
  <!-- 说明文字 -->
  <text x="300" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#666" font-weight="bold">功能分解原则</text>
  <text x="300" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">• 从抽象到具体</text>
  <text x="300" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">• 从整体到局部</text>
  <text x="300" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#888">• 复杂性逐层降低</text>
  
  <!-- 装饰性箭头 -->
  <path d="M 50 120 Q 300 90 550 120" stroke="#ddd" stroke-width="1" fill="none" stroke-dasharray="3,3"/>
  <text x="300" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#aaa">分解方向</text>
</svg>