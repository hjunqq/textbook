<svg width="500" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 16px sans-serif; text-anchor: middle; }
      .stage { font: bold 12px sans-serif; text-anchor: middle; fill: white; }
    </style>
  </defs>
  
  <!-- 标题 -->
  <text x="250" y="30" class="title">瀑布模型</text>
  
  <!-- 各个阶段 -->
  <rect x="100" y="60" width="200" height="50" rx="5" fill="#ff6b6b" stroke="#000"/>
  <text x="200" y="90" class="stage">需求分析</text>
  
  <rect x="100" y="130" width="200" height="50" rx="5" fill="#4ecdc4" stroke="#000"/>
  <text x="200" y="160" class="stage">系统设计</text>
  
  <rect x="100" y="200" width="200" height="50" rx="5" fill="#45b7d1" stroke="#000"/>
  <text x="200" y="230" class="stage">程序设计</text>
  
  <rect x="100" y="270" width="200" height="50" rx="5" fill="#f9ca24" stroke="#000"/>
  <text x="200" y="300" class="stage">编码实现</text>
  
  <rect x="100" y="340" width="200" height="50" rx="5" fill="#6c5ce7" stroke="#000"/>
  <text x="200" y="370" class="stage">测试</text>
  
  <rect x="100" y="410" width="200" height="50" rx="5" fill="#a0e7e5" stroke="#000"/>
  <text x="200" y="440" class="stage">运行维护</text>
  
  <!-- 箭头 -->
  <polygon points="190,115 200,125 210,115 200,135" fill="#333"/>
  <polygon points="190,185 200,195 210,185 200,205" fill="#333"/>
  <polygon points="190,255 200,265 210,255 200,275" fill="#333"/>
  <polygon points="190,325 200,335 210,325 200,345" fill="#333"/>
  <polygon points="190,395 200,405 210,395 200,415" fill="#333"/>
</svg> 