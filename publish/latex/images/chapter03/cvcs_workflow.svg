<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="400" fill="#f9f9f9"/>
  
  <!-- 标题 -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">集中式版本控制工作流程示意图</text>
  
  <!-- 定义箭头 -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#666"/>
    </marker>
  </defs>
  
  <!-- 中央服务器 -->
  <rect x="250" y="60" width="100" height="80" fill="#4CAF50" stroke="#388E3C" stroke-width="2" rx="10"/>
  <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">中央服务器</text>
  <text x="300" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">版本仓库</text>
  <text x="300" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">(SVN/CVS)</text>
  
  <!-- 开发者1 -->
  <circle cx="120" cy="200" r="40" fill="#2196F3" stroke="#1976D2" stroke-width="2"/>
  <text x="120" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">开发者A</text>
  <text x="120" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">工作副本</text>
  
  <!-- 开发者2 -->
  <circle cx="300" cy="280" r="40" fill="#2196F3" stroke="#1976D2" stroke-width="2"/>
  <text x="300" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">开发者B</text>
  <text x="300" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">工作副本</text>
  
  <!-- 开发者3 -->
  <circle cx="480" cy="200" r="40" fill="#2196F3" stroke="#1976D2" stroke-width="2"/>
  <text x="480" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">开发者C</text>
  <text x="480" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">工作副本</text>
  
  <!-- 连接线和箭头 -->
  <!-- 从服务器到开发者 - checkout/update -->
  <path d="M 270 140 Q 200 150 150 180" stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="160" font-size="10" fill="#FF6F00">checkout/update</text>
  
  <path d="M 300 140 L 300 240" stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="190" font-size="10" fill="#FF6F00">checkout</text>
  
  <path d="M 330 140 Q 400 150 450 180" stroke="#FF9800" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="160" font-size="10" fill="#FF6F00">checkout/update</text>
  
  <!-- 从开发者到服务器 - commit -->
  <path d="M 150 180 Q 200 170 270 140" stroke="#F44336" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="145" font-size="10" fill="#D32F2F">commit</text>
  
  <path d="M 300 240 L 300 140" stroke="#F44336" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="270" y="190" font-size="10" fill="#D32F2F">commit</text>
  
  <path d="M 450 180 Q 400 170 330 140" stroke="#F44336" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="145" font-size="10" fill="#D32F2F">commit</text>
  
  <!-- 工作流程说明 -->
  <g transform="translate(50, 340)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#555">工作流程：</text>
    <text x="150" y="0" font-size="10" fill="#666">1. 从中央服务器checkout代码</text>
    <text x="300" y="0" font-size="10" fill="#666">2. 本地修改代码</text>
    <text x="420" y="0" font-size="10" fill="#666">3. commit提交到服务器</text>
    <text x="150" y="20" font-size="10" fill="#666">4. 其他开发者update获取最新代码</text>
    <text x="350" y="20" font-size="10" fill="#666">5. 解决冲突后继续开发</text>
  </g>
  
  <!-- 特点标注 -->
  <rect x="20" y="60" width="120" height="60" fill="#FFF3E0" stroke="#FF9800" rx="5"/>
  <text x="80" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#F57C00">特点</text>
  <text x="80" y="95" text-anchor="middle" font-size="9" fill="#E65100">• 单点中央服务器</text>
  <text x="80" y="108" text-anchor="middle" font-size="9" fill="#E65100">• 顺序版本号</text>
</svg>