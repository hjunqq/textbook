<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="700" height="400" fill="#f9f9f9"/>
  
  <!-- 标题 -->
  <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Git Flow 工作流分支结构</text>
  
  <!-- 定义箭头和点 -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#666"/>
    </marker>
    <circle id="commit" r="4" fill="#4CAF50"/>
    <circle id="merge" r="4" fill="#FF9800"/>
  </defs>
  
  <!-- 分支标签 -->
  <text x="50" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">master</text>
  <text x="50" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2196F3">develop</text>
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FF5722">feature</text>
  <text x="50" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9C27B0">release</text>
  <text x="50" y="280" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#F44336">hotfix</text>
  
  <!-- Master 分支 -->
  <line x1="100" y1="75" x2="650" y2="75" stroke="#333" stroke-width="3"/>
  <use href="#commit" x="150" y="75"/>
  <use href="#commit" x="450" y="75"/>
  <use href="#commit" x="600" y="75"/>
  <text x="150" y="95" text-anchor="middle" font-size="10" fill="#666">v1.0</text>
  <text x="450" y="95" text-anchor="middle" font-size="10" fill="#666">v1.1</text>
  <text x="600" y="95" text-anchor="middle" font-size="10" fill="#666">v1.2</text>
  
  <!-- Develop 分支 -->
  <line x1="100" y1="125" x2="650" y2="125" stroke="#2196F3" stroke-width="2"/>
  <use href="#commit" x="150" y="125"/>
  <use href="#commit" x="200" y="125"/>
  <use href="#commit" x="300" y="125"/>
  <use href="#commit" x="400" y="125"/>
  <use href="#commit" x="500" y="125"/>
  <use href="#commit" x="550" y="125"/>
  
  <!-- Feature 分支 -->
  <line x1="200" y1="175" x2="300" y2="175" stroke="#FF5722" stroke-width="2"/>
  <use href="#commit" x="220" y="175"/>
  <use href="#commit" x="260" y="175"/>
  
  <!-- Feature 分支连接线 -->
  <line x1="200" y1="125" x2="200" y2="175" stroke="#FF5722" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="300" y1="175" x2="300" y2="125" stroke="#FF5722" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Release 分支 -->
  <line x1="400" y1="225" x2="450" y2="225" stroke="#9C27B0" stroke-width="2"/>
  <use href="#commit" x="425" y="225"/>
  
  <!-- Release 分支连接线 -->
  <line x1="400" y1="125" x2="400" y2="225" stroke="#9C27B0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="450" y1="225" x2="450" y2="125" stroke="#9C27B0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="450" y1="225" x2="450" y2="75" stroke="#9C27B0" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Hotfix 分支 -->
  <line x1="450" y1="275" x2="500" y2="275" stroke="#F44336" stroke-width="2"/>
  <use href="#commit" x="475" y="275"/>
  
  <!-- Hotfix 分支连接线 -->
  <line x1="450" y1="75" x2="450" y2="275" stroke="#F44336" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="275" x2="500" y2="125" stroke="#F44336" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- 另一个Feature分支 -->
  <line x1="500" y1="180" x2="550" y2="180" stroke="#FF5722" stroke-width="2"/>
  <use href="#commit" x="525" y="180"/>
  
  <!-- 第二个Feature分支连接线 -->
  <line x1="500" y1="125" x2="500" y2="180" stroke="#FF5722" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="550" y1="180" x2="550" y2="125" stroke="#FF5722" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- 说明文字 -->
  <text x="350" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#555">分支说明</text>
  <text x="100" y="350" font-family="Arial, sans-serif" font-size="10" fill="#666">• master: 生产环境分支，包含稳定版本</text>
  <text x="100" y="365" font-family="Arial, sans-serif" font-size="10" fill="#666">• develop: 开发分支，包含最新开发功能</text>
  <text x="400" y="350" font-family="Arial, sans-serif" font-size="10" fill="#666">• feature: 功能分支，从develop分出，完成后合并回develop</text>
  <text x="400" y="365" font-family="Arial, sans-serif" font-size="10" fill="#666">• release: 发布分支，准备发布时从develop创建</text>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="10" fill="#666">• hotfix: 紧急修复分支，从master创建，修复后合并到master和develop</text>
  
  <!-- 时间轴 -->
  <line x1="100" y1="320" x2="650" y2="320" stroke="#ddd" stroke-width="1"/>
  <text x="100" y="315" text-anchor="middle" font-size="9" fill="#999">时间</text>
  <text x="650" y="315" text-anchor="middle" font-size="9" fill="#999">→</text>
</svg>