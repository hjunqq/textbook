<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="600" height="300" fill="#f9f9f9"/>
  
  <!-- 标题 -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">GitHub Flow 工作流程</text>
  
  <!-- 定义箭头和点 -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#666"/>
    </marker>
    <circle id="commit" r="4" fill="#4CAF50"/>
  </defs>
  
  <!-- 主分支 -->
  <text x="30" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">main</text>
  <line x1="80" y1="75" x2="570" y2="75" stroke="#333" stroke-width="3"/>
  <use href="#commit" x="120" y="75"/>
  <use href="#commit" x="280" y="75"/>
  <use href="#commit" x="480" y="75"/>
  <use href="#commit" x="520" y="75"/>
  
  <!-- Feature分支 -->
  <text x="30" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2196F3">feature</text>
  <line x1="120" y1="125" x2="280" y2="125" stroke="#2196F3" stroke-width="2"/>
  <use href="#commit" x="160" y="125"/>
  <use href="#commit" x="200" y="125"/>
  <use href="#commit" x="240" y="125"/>
  
  <!-- 分支连接线 -->
  <line x1="120" y1="75" x2="120" y2="125" stroke="#2196F3" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="125" x2="280" y2="75" stroke="#2196F3" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- 另一个Feature分支 -->
  <line x1="280" y1="135" x2="480" y2="135" stroke="#FF5722" stroke-width="2"/>
  <use href="#commit" x="320" y="135"/>
  <use href="#commit" x="360" y="135"/>
  <use href="#commit" x="420" y="135"/>
  
  <!-- 第二个分支连接线 -->
  <line x1="280" y1="75" x2="280" y2="135" stroke="#FF5722" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="135" x2="480" y2="75" stroke="#FF5722" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- 流程步骤 -->
  <g transform="translate(50, 180)">
    <!-- 步骤1 -->
    <rect x="0" y="0" width="80" height="40" fill="#E3F2FD" stroke="#2196F3" stroke-width="1" rx="5"/>
    <text x="40" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#1976D2">1. 创建分支</text>
    <text x="40" y="28" text-anchor="middle" font-size="9" fill="#1976D2">从main创建</text>
    
    <!-- 箭头1 -->
    <path d="M 80 20 L 100 20" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- 步骤2 -->
    <rect x="110" y="0" width="80" height="40" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1" rx="5"/>
    <text x="150" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#7B1FA2">2. 开发功能</text>
    <text x="150" y="28" text-anchor="middle" font-size="9" fill="#7B1FA2">提交代码</text>
    
    <!-- 箭头2 -->
    <path d="M 190 20 L 210 20" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- 步骤3 -->
    <rect x="220" y="0" width="80" height="40" fill="#FFF3E0" stroke="#FF9800" stroke-width="1" rx="5"/>
    <text x="260" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#F57C00">3. Pull Request</text>
    <text x="260" y="28" text-anchor="middle" font-size="9" fill="#F57C00">代码审查</text>
    
    <!-- 箭头3 -->
    <path d="M 300 20 L 320 20" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- 步骤4 -->
    <rect x="330" y="0" width="80" height="40" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1" rx="5"/>
    <text x="370" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#388E3C">4. 部署测试</text>
    <text x="370" y="28" text-anchor="middle" font-size="9" fill="#388E3C">验证功能</text>
    
    <!-- 箭头4 -->
    <path d="M 410 20 L 430 20" stroke="#666" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- 步骤5 -->
    <rect x="440" y="0" width="80" height="40" fill="#FFEBEE" stroke="#F44336" stroke-width="1" rx="5"/>
    <text x="480" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#D32F2F">5. 合并部署</text>
    <text x="480" y="28" text-anchor="middle" font-size="9" fill="#D32F2F">发布到生产</text>
  </g>
  
  <!-- 特点说明 -->
  <text x="300" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555">GitHub Flow 特点：简单、快速、持续部署</text>
  <text x="300" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">适合Web应用和持续交付的项目</text>
</svg>