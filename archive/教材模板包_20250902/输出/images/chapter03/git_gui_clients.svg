<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#f9f9f9"/>
  
  <!-- 标题 -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#333">常见Git GUI客户端比较</text>
  
  <!-- 表格头部 -->
  <rect x="50" y="60" width="700" height="40" fill="#2196F3" stroke="#1976D2" stroke-width="1"/>
  <text x="120" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">客户端名称</text>
  <text x="250" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">平台支持</text>
  <text x="350" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">费用</text>
  <text x="450" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">易用性</text>
  <text x="550" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">功能特色</text>
  <text x="680" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">推荐指数</text>
  
  <!-- 表格数据行 -->
  
  <!-- GitHub Desktop -->
  <rect x="50" y="100" width="700" height="50" fill="#E8F5E8" stroke="#4CAF50" stroke-width="1"/>
  <text x="120" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2E7D32">GitHub Desktop</text>
  <text x="120" y="135" text-anchor="middle" font-size="9" fill="#1B5E20">官方推荐</text>
  <text x="250" y="125" text-anchor="middle" font-size="10" fill="#333">Windows, macOS</text>
  <text x="350" y="125" text-anchor="middle" font-size="10" fill="#333">免费</text>
  <text x="450" y="125" text-anchor="middle" font-size="10" fill="#333">★★★★★</text>
  <text x="550" y="120" text-anchor="middle" font-size="9" fill="#333">简洁界面，GitHub集成</text>
  <text x="550" y="135" text-anchor="middle" font-size="9" fill="#333">初学者友好</text>
  <text x="680" y="125" text-anchor="middle" font-size="12" fill="#FF9800">★★★★☆</text>
  
  <!-- Sourcetree -->
  <rect x="50" y="150" width="700" height="50" fill="#E3F2FD" stroke="#2196F3" stroke-width="1"/>
  <text x="120" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976D2">Sourcetree</text>
  <text x="120" y="185" text-anchor="middle" font-size="9" fill="#1565C0">Atlassian出品</text>
  <text x="250" y="175" text-anchor="middle" font-size="10" fill="#333">Windows, macOS</text>
  <text x="350" y="175" text-anchor="middle" font-size="10" fill="#333">免费</text>
  <text x="450" y="175" text-anchor="middle" font-size="10" fill="#333">★★★★☆</text>
  <text x="550" y="170" text-anchor="middle" font-size="9" fill="#333">功能强大，可视化好</text>
  <text x="550" y="185" text-anchor="middle" font-size="9" fill="#333">Git Flow支持</text>
  <text x="680" y="175" text-anchor="middle" font-size="12" fill="#FF9800">★★★★★</text>
  
  <!-- GitKraken -->
  <rect x="50" y="200" width="700" height="50" fill="#F3E5F5" stroke="#9C27B0" stroke-width="1"/>
  <text x="120" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7B1FA2">GitKraken</text>
  <text x="120" y="235" text-anchor="middle" font-size="9" fill="#6A1B9A">界面精美</text>
  <text x="250" y="225" text-anchor="middle" font-size="10" fill="#333">跨平台</text>
  <text x="350" y="220" text-anchor="middle" font-size="9" fill="#333">免费版</text>
  <text x="350" y="235" text-anchor="middle" font-size="9" fill="#333">付费专业版</text>
  <text x="450" y="225" text-anchor="middle" font-size="10" fill="#333">★★★★☆</text>
  <text x="550" y="220" text-anchor="middle" font-size="9" fill="#333">界面美观，功能全面</text>
  <text x="550" y="235" text-anchor="middle" font-size="9" fill="#333">内置合并工具</text>
  <text x="680" y="225" text-anchor="middle" font-size="12" fill="#FF9800">★★★★☆</text>
  
  <!-- Git Extensions -->
  <rect x="50" y="250" width="700" height="50" fill="#FFF3E0" stroke="#FF9800" stroke-width="1"/>
  <text x="120" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#F57C00">Git Extensions</text>
  <text x="120" y="285" text-anchor="middle" font-size="9" fill="#EF6C00">开源项目</text>
  <text x="250" y="275" text-anchor="middle" font-size="10" fill="#333">Windows</text>
  <text x="350" y="275" text-anchor="middle" font-size="10" fill="#333">免费</text>
  <text x="450" y="275" text-anchor="middle" font-size="10" fill="#333">★★★☆☆</text>
  <text x="550" y="270" text-anchor="middle" font-size="9" fill="#333">功能丰富</text>
  <text x="550" y="285" text-anchor="middle" font-size="9" fill="#333">Windows集成好</text>
  <text x="680" y="275" text-anchor="middle" font-size="12" fill="#FF9800">★★★☆☆</text>
  
  <!-- TortoiseGit -->
  <rect x="50" y="300" width="700" height="50" fill="#FFEBEE" stroke="#F44336" stroke-width="1"/>
  <text x="120" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D32F2F">TortoiseGit</text>
  <text x="120" y="335" text-anchor="middle" font-size="9" fill="#C62828">Windows集成</text>
  <text x="250" y="325" text-anchor="middle" font-size="10" fill="#333">Windows</text>
  <text x="350" y="325" text-anchor="middle" font-size="10" fill="#333">免费</text>
  <text x="450" y="325" text-anchor="middle" font-size="10" fill="#333">★★★☆☆</text>
  <text x="550" y="320" text-anchor="middle" font-size="9" fill="#333">右键菜单集成</text>
  <text x="550" y="335" text-anchor="middle" font-size="9" fill="#333">类似TortoiseSVN</text>
  <text x="680" y="325" text-anchor="middle" font-size="12" fill="#FF9800">★★★☆☆</text>
  
  <!-- VS Code内置 -->
  <rect x="50" y="350" width="700" height="50" fill="#E1F5FE" stroke="#00BCD4" stroke-width="1"/>
  <text x="120" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#00838F">VS Code内置</text>
  <text x="120" y="385" text-anchor="middle" font-size="9" fill="#006064">编辑器集成</text>
  <text x="250" y="375" text-anchor="middle" font-size="10" fill="#333">跨平台</text>
  <text x="350" y="375" text-anchor="middle" font-size="10" fill="#333">免费</text>
  <text x="450" y="375" text-anchor="middle" font-size="10" fill="#333">★★★★☆</text>
  <text x="550" y="370" text-anchor="middle" font-size="9" fill="#333">无缝集成开发</text>
  <text x="550" y="385" text-anchor="middle" font-size="9" fill="#333">丰富插件支持</text>
  <text x="680" y="375" text-anchor="middle" font-size="12" fill="#FF9800">★★★★☆</text>
  
  <!-- Tower -->
  <rect x="50" y="400" width="700" height="50" fill="#F9F9F9" stroke="#607D8B" stroke-width="1"/>
  <text x="120" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#455A64">Tower</text>
  <text x="120" y="435" text-anchor="middle" font-size="9" fill="#37474F">专业级工具</text>
  <text x="250" y="425" text-anchor="middle" font-size="10" fill="#333">Windows, macOS</text>
  <text x="350" y="425" text-anchor="middle" font-size="10" fill="#333">付费</text>
  <text x="450" y="425" text-anchor="middle" font-size="10" fill="#333">★★★★★</text>
  <text x="550" y="420" text-anchor="middle" font-size="9" fill="#333">专业功能丰富</text>
  <text x="550" y="435" text-anchor="middle" font-size="9" fill="#333">企业级支持</text>
  <text x="680" y="425" text-anchor="middle" font-size="12" fill="#FF9800">★★★★☆</text>
  
  <!-- 选择建议 -->
  <g transform="translate(50, 480)">
    <rect x="0" y="0" width="700" height="100" fill="#FAFAFA" stroke="#E0E0E0" stroke-width="1" rx="8"/>
    <text x="350" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">选择建议</text>
    
    <text x="30" y="45" font-size="11" font-weight="bold" fill="#1976D2">初学者推荐：</text>
    <text x="130" y="45" font-size="10" fill="#333">GitHub Desktop - 界面简洁，容易上手</text>
    
    <text x="30" y="60" font-size="11" font-weight="bold" fill="#388E3C">进阶用户：</text>
    <text x="110" y="60" font-size="10" fill="#333">Sourcetree - 功能全面，可视化好</text>
    
    <text x="30" y="75" font-size="11" font-weight="bold" fill="#F57C00">开发集成：</text>
    <text x="120" y="75" font-size="10" fill="#333">VS Code内置Git - 开发过程无缝集成</text>
    
    <text x="400" y="45" font-size="11" font-weight="bold" fill="#7B1FA2">企业用户：</text>
    <text x="480" y="45" font-size="10" fill="#333">Tower, GitKraken专业版</text>
    
    <text x="400" y="60" font-size="11" font-weight="bold" fill="#D32F2F">Windows用户：</text>
    <text x="500" y="60" font-size="10" fill="#333">TortoiseGit - 系统集成度高</text>
    
    <text x="400" y="75" font-size="11" font-weight="bold" fill="#00838F">跨平台：</text>
    <text x="470" y="75" font-size="10" fill="#333">GitKraken, Sourcetree</text>
  </g>
</svg>