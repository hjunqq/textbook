<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 16px sans-serif; text-anchor: middle; }
      .layer { font: bold 12px sans-serif; text-anchor: middle; fill: white; }
      .component { font: 10px sans-serif; text-anchor: middle; fill: white; }
    </style>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="30" class="title">智慧水利平台功能体系框架图</text>
  
  <!-- 顶层平台 -->
  <rect x="300" y="50" width="200" height="60" rx="5" fill="#1890ff" stroke="#000"/>
  <text x="400" y="85" class="layer">智慧水利平台</text>
  
  <!-- 第二层：三大层次 -->
  <rect x="50" y="150" width="150" height="50" rx="5" fill="#52c41a" stroke="#000"/>
  <text x="125" y="180" class="layer">数据层</text>
  
  <rect x="325" y="150" width="150" height="50" rx="5" fill="#52c41a" stroke="#000"/>
  <text x="400" y="180" class="layer">服务层</text>
  
  <rect x="600" y="150" width="150" height="50" rx="5" fill="#52c41a" stroke="#000"/>
  <text x="675" y="180" class="layer">应用层</text>
  
  <!-- 第三层：具体功能 -->
  <rect x="25" y="250" width="100" height="40" rx="5" fill="#faad14" stroke="#000"/>
  <text x="75" y="275" class="component">水文监测</text>
  
  <rect x="150" y="250" width="100" height="40" rx="5" fill="#faad14" stroke="#000"/>
  <text x="200" y="275" class="component">水质监测</text>
  
  <rect x="300" y="250" width="100" height="40" rx="5" fill="#faad14" stroke="#000"/>
  <text x="350" y="275" class="component">调度服务</text>
  
  <rect x="425" y="250" width="100" height="40" rx="5" fill="#faad14" stroke="#000"/>
  <text x="475" y="275" class="component">预警服务</text>
  
  <rect x="575" y="250" width="100" height="40" rx="5" fill="#faad14" stroke="#000"/>
  <text x="625" y="275" class="component">三维展示</text>
  
  <!-- 连接线 -->
  <line x1="400" y1="110" x2="125" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="110" x2="400" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="110" x2="675" y2="150" stroke="#333" stroke-width="2"/>
  
  <line x1="125" y1="200" x2="75" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="125" y1="200" x2="200" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="400" y1="200" x2="350" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="400" y1="200" x2="475" y2="250" stroke="#333" stroke-width="1"/>
  <line x1="675" y1="200" x2="625" y2="250" stroke="#333" stroke-width="1"/>
</svg> 