<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: bold 16px sans-serif; text-anchor: middle; }
      .step { font: bold 10px sans-serif; text-anchor: middle; fill: white; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="300" y="30" class="title">数据预处理的质量控制流程图</text>
  
  <!-- 流程步骤 -->
  <rect x="50" y="60" width="120" height="40" rx="5" fill="#4ecdc4" stroke="#000"/>
  <text x="110" y="85" class="step">原始数据采集</text>
  
  <rect x="240" y="60" width="120" height="40" rx="5" fill="#45b7d1" stroke="#000"/>
  <text x="300" y="85" class="step">数据质量检查</text>
  
  <rect x="430" y="60" width="120" height="40" rx="5" fill="#f9ca24" stroke="#000"/>
  <text x="490" y="85" class="step">数据清洗</text>
  
  <rect x="150" y="140" width="120" height="40" rx="5" fill="#6c5ce7" stroke="#000"/>
  <text x="210" y="165" class="step">数据筛选</text>
  
  <rect x="330" y="140" width="120" height="40" rx="5" fill="#a0e7e5" stroke="#000"/>
  <text x="390" y="165" class="step">数据标准化</text>
  
  <rect x="240" y="220" width="120" height="40" rx="5" fill="#ff6b6b" stroke="#000"/>
  <text x="300" y="245" class="step">质量验证</text>
  
  <rect x="240" y="300" width="120" height="40" rx="5" fill="#52c41a" stroke="#000"/>
  <text x="300" y="325" class="step">输出处理结果</text>
  
  <!-- 箭头连接 -->
  <path d="M 170 80 L 230 80" class="arrow"/>
  <path d="M 360 80 L 420 80" class="arrow"/>
  <path d="M 490 100 L 490 120 L 270 120 L 270 140" class="arrow"/>
  <path d="M 270 140 L 320 140" class="arrow"/>
  <path d="M 330 160 L 270 160 L 270 180 L 300 180 L 300 220" class="arrow"/>
  <path d="M 300 260 L 300 290" class="arrow"/>
</svg> 